</style></head><body><main class="wrap"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><div class="brand">VOCAB TRAINER · TOEIC</div><button class="btn secondary" id="soundToggle" type="button" style="padding:9px 12px;font-size:13px;margin-bottom:18px" aria-pressed="true">🔊 효과음 켜짐</button></div>
<h1>TOEIC 어휘 트레이너</h1><p class="sub">230개 단어를 자유롭게 학습하거나 문제를 풀며 익혀 보세요.</p>
<section class="panel">

</section></main>

let questions=[],idx=0,score=0,wrong=[],answered=false,direction='en',done=0,lastPool=null;
let studyWords=[],studyIdx=0,quizHasStarted=false;
// Web Audio로 별도 음원 파일 없이 가벼운 UI 효과음을 생성합니다.
let soundEnabled=localStorage.getItem('vocabSoundEnabled')!=='false';
let audioCtx=null;
function audio(){
 const AC=window.AudioContext||window.webkitAudioContext;
 if(!AC)return null;
 if(!audioCtx)audioCtx=new AC();
 if(audioCtx.state==='suspended')audioCtx.resume();
 return audioCtx;
}
function tone(freq,start,duration,type='sine',volume=.045){
 const c=audio();if(!c||!soundEnabled)return;
 const o=c.createOscillator(),g=c.createGain();
 o.type=type;o.frequency.setValueAtTime(freq,c.currentTime+start);
 g.gain.setValueAtTime(.0001,c.currentTime+start);
 g.gain.exponentialRampToValueAtTime(volume,c.currentTime+start+.012);
 g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+start+duration);
 o.connect(g);g.connect(c.destination);o.start(c.currentTime+start);o.stop(c.currentTime+start+duration+.025);
}
function playSound(kind='click'){
 if(!soundEnabled)return;
 if(kind==='correct'){tone(660,0,.12,'sine',.055);tone(880,.11,.18,'sine',.05);}
 else if(kind==='wrong'){tone(330,0,.16,'triangle',.045);tone(247,.13,.22,'triangle',.04);}
 else {tone(520,0,.045,'sine',.018);}
}
function refreshSoundButton(){const b=document.getElementById('soundToggle');if(!b)return;b.textContent=soundEnabled?'🔊 효과음 켜짐':'🔇 효과음 꺼짐';b.setAttribute('aria-pressed',String(soundEnabled));}
document.addEventListener('DOMContentLoaded',()=>{refreshSoundButton();const b=document.getElementById('soundToggle');if(b)b.addEventListener('click',()=>{soundEnabled=!soundEnabled;localStorage.setItem('vocabSoundEnabled',String(soundEnabled));refreshSoundButton();if(soundEnabled)playSound('click')})});

function startQuiz(custom=null){
 quizHasStarted=true;
 lastPool=custom?[...custom]:null;
 let pool=custom||WORDS;pool=$('order').value==='random'?shuffle(pool):[...pool];
 let n=custom?custom.length:($('amount').value==='all'?pool.length:Number($('amount').value));
 questions=pool.slice(0,n).map(w=>({...w,dir:direction==='mix'?(Math.random()<.5?'en':'ko'):direction}));
 idx=0;score=0;wrong=[];done=0;show('quizScreen');render();
}
function render(){answered=false;const q=questions[idx];$('number').textContent=`문제 ${idx+1} / ${questions.length}`;$('bar').style.width=`${idx/questions.length*100}%`;
 $('kind').textContent=q.dir==='en'?'영어 → 뜻':'뜻 → 영어';
 $('prompt').innerHTML=q.dir==='en'?`${escapeHtml(q.word)} <span class="pos">${escapeHtml(q.pos||'')}</span>`:escapeHtml(q.meaning);
 $('answer').value='';$('answer').disabled=false;$('submit').disabled=false;$('dontknow').disabled=false;$('next').disabled=false;$('next').textContent=idx===questions.length-1?'결과 보기':'다음 문제 →';
 $('feedback').className='feedback';$('feedback').textContent='답을 입력한 뒤 정답 확인을 눌러 주세요.';$('answer').focus();
}
function beginStudy(){
 let list=$('studyList').value;let pool=list==='all'?[...WORDS]:WORDS.slice(Number(list)*50,Math.min(Number(list)*50+50,WORDS.length));
 if($('studyOrder').value==='random')pool=shuffle(pool);
 let n=$('studyAmount').value==='all'?pool.length:Number($('studyAmount').value);
 studyWords=pool.slice(0,n);studyIdx=0;show('studyScreen');renderStudy();
}

 const pos=w.pos||'';const word=w.word;
 if(pos.includes('(부)'))return {en:`The sales figures changed ${word} during the final quarter.`,ko:`마지막 분기에 매출 수치가 ${w.meaning} 변했다.`};
 if(pos.includes('(형)'))return {en:`The proposal is ${word} and meets the client's needs.`,ko:`그 제안은 ${w.meaning} 고객의 요구를 충족한다.`};
 if(pos.includes('(동)'))return {en:`The manager plans to ${word} the request by Friday.`,ko:`관리자는 금요일까지 그 요청을 ${w.meaning}할 계획이다.`};
 return {en:`The report mentions ${word} in its final section.`,ko:`그 보고서는 마지막 부분에서 ${w.meaning}을 언급한다.`};
}
function renderStudy(){if(!studyWords.length)return;const w=studyWords[studyIdx];const ex=makeExample(w);$('studyNumber').textContent=`단어 ${studyIdx+1} / ${studyWords.length}`;$('studyPos').textContent=w.pos||'';$('studyWord').textContent=w.word;$('studyMeaning').textContent=w.meaning;$('studyExample').textContent=ex.en;$('studyTranslation').textContent=ex.ko;$('studyPrev').disabled=studyIdx===0;$('studyNext').textContent=studyIdx===studyWords.length-1?'처음으로':'다음 →';}
function moveStudy(n){if(n===1&&studyIdx===studyWords.length-1){studyIdx=0}else studyIdx=Math.max(0,Math.min(studyWords.length-1,studyIdx+n));renderStudy()}
function norm(s){return String(s||'').toLowerCase().replace(/\s+/g,'').replace(/[.,;:!?·ㆍ()[\]{}'"“”‘’]/g,'').trim()}
function isCorrect(input,q){if(q.dir==='ko')return norm(input)===norm(q.word);
 const expected=String(q.meaning).split(/[;,/、·]/).map(x=>x.trim()).filter(Boolean);
 return expected.some(x=>norm(input)===norm(x))||norm(input)===norm(q.meaning)}
function reveal(ok,skipped=false){if(answered)return;answered=true;playSound(ok&&!skipped?'correct':'wrong');done++;const q=questions[idx];if(ok&&!skipped)score++;else wrong.push(q);
 $('answer').disabled=true;$('submit').disabled=true;$('dontknow').disabled=true;$('next').disabled=false;
 const answer=q.dir==='en'?q.meaning:q.word;
 $('feedback').className='feedback '+(ok&&!skipped?'good':'bad');
 $('feedback').textContent=skipped?`정답은 “${answer}”입니다.`:ok?'정답이에요! 잘했어요.':`아쉬워요. 정답은 “${answer}”입니다.`;
 $('next').focus();
}
$('submit').onclick=()=>{if(!$('answer').value.trim()){ $('feedback').className='feedback bad';$('feedback').textContent='정답을 먼저 입력해 주세요.';return;}reveal(isCorrect($('answer').value,questions[idx]))};
$('answer').addEventListener('keydown',e=>{if(e.key==='Enter'){if(answered)advance();else $('submit').click()}});
$('dontknow').onclick=()=>reveal(false,true);
$('next').onclick=advance;
function advance(){if(!answered){playSound('wrong');wrong.push(questions[idx]);answered=true;done++;}if(idx<questions.length-1){idx++;render()}else finish()}
$('showProgress').onclick=showProgress;
$('resume').onclick=()=>{show('quizScreen');$('answer').focus()};$('pauseHome').onclick=()=>show('homeScreen');$('resultHome').onclick=()=>show('homeScreen');
$('pauseRestart').onclick=()=>startQuiz(lastPool);
function showProgress(){
 const rate=done?Math.round(score/done*100):0;
 $('pauseScore').textContent=`${score} / ${done}`;
 $('pauseDone').textContent=`${done} / ${questions.length}`;
 $('pauseRate').textContent=`${rate}%`;
 $('pauseWrong').textContent=wrong.length;
 $('pauseSummary').textContent=`전체 ${questions.length}문제 중 ${done}문제를 진행했어요. 현재 문제부터 이어서 풀 수 있습니다.`;
 show('pauseScreen');
}
function finish(){show('resultScreen');$('bar').style.width='100%';$('score').textContent=`${score} / ${questions.length}`;$('summary').textContent=`정답률 ${Math.round(score/questions.length*100)}% · 다시 풀 오답 ${wrong.length}개`;$('retryWrong').disabled=wrong.length===0}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
refreshSoundButton();
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
